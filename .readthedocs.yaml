# config file for readthedocs

version: 2  # version 1 is deprecated and version 3 does not exist

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"  # update this if pyproject.toml version changes

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py