[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "Octavian"
version = "0.5.1"
description = "Simulation analysis toolkit for SPH codes with built-in galaxy finding."
requires-python = ">=3.14"
authors = [
    {name = "JP Duminy", email = "jp@duminy.org"},
    {name = "Jakub Szpila"},
]
maintainers = [
    {name = "JP Duminy", email = "jp@duminy.org"},
]

dependencies = [
    "numpy>=2.4",
    "scipy>=1.18",
    "astropy>=8.0",
    "h5py>=3.16",
    "numba>=0.65",
]

keywords = ["astrophysics", "cosmology", "simulation", 
            "galaxy", "halo", "sph", 
            "fof", "analysis", "hdf5"]

[project.optional-dependencies]
mpi = ["mpi4py>=4.1.2"]
test = [
    "pytest>=8.0", 
    "pytest-cov>=5.0",
    "memray>=1.19.1",
    ]

[project.urls]
Repository = "https://github.com/jp-duminy/octavian"

[tool.setuptools.packages.find]
include = ["octavian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]