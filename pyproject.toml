[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Octavian"
dynamic = ["version"]
description = "Simulation analysis toolkit for SPH codes with built-in galaxy finding."
requires-python = ">=3.14"
authors = [
    {name = "JP Duminy", email = "jp@duminy.org"},
    {name = "Jakub Szpila"},
]
maintainers = [
    {name = "JP Duminy", email = "jp@duminy.org"},
]

dependencies = [
    "numpy>=2.4",
    "scipy>=1.18",
    "astropy>=8.0",
    "h5py>=3.16",
    "numba>=0.65",
    "mpi4py>=4.1.2"
]

keywords = ["astrophysics", "cosmology", "simulation", 
            "galaxy", "halo", "sph", 
            "fof", "analysis", "hdf5"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0", 
    "pytest-cov>=5.0",
    "memray>=1.19.1",
    "psutil>=7.2.2",
]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20"
]

[project.urls]
Repository = "https://github.com/jp-duminy/octavian"

[tool.setuptools.packages.find]
include = ["octavian*"]
[tool.setuptools.dynamic]
version = {attr = "octavian.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--tb=short", "-q"]
strict_markers = true
markers = [
    "slow: long-running tests (not run in CI)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:numba",
    "ignore::DeprecationWarning:h5py",
]

[tool.ruff]
line-length = 120