name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev  # for mpiexec
      
      - name: Install Octavius
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov --cov-report=xml

      - name: Upload code coverage results
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
