# if you are looking for user parameters, please refer to config.yaml
# only touch this if working on Octavian internals please

ptypes: [gas, star, dm, bh]
baryonic_ptypes: [gas, star, bh]
groups: [halos, galaxies]

group_types:
  halos:
    key: HaloID
    kind: halo
    ptypes: [gas, star, dm, bh]
    hdf5_group: halo_data
  galaxies:
    key: GalID
    kind: galaxy
    ptypes: [gas, star, bh]
    hdf5_group: galaxy_data

# aggregate properties stage dependency graph

stages:

  properties_core:
    label: core
    applies_to: [halos, galaxies]
    requires: []
    needs_particle_columns: [pos, vel, mass, potential]
    outputs:
      - columns: ["n_{ptype}", "mass_{ptype}"]
        over: {ptype: [gas, star, dm, bh]}
      - columns: ["L_{ptype}", "velocity_dispersion_{ptype}", "L_azimuth_{ptype}", "L_elevation_{ptype}", "inertia_tensor_{ptype}"]
        over: {ptype: [gas, star, dm, bh]}
      - columns: ["BoverT_{ptype}", "kappa_rot_{ptype}"]
        over: {ptype: [gas, star, dm, bh]}
        applies_to: [galaxies]
      - columns: ["mass_{combined}", "L_{combined}", "velocity_dispersion_{combined}", "L_azimuth_{combined}", "L_elevation_{combined}", "inertia_tensor_{combined}"]
        over: {combined: [total, baryon]}
      - columns: ["com_pos_{combined}", "com_vel_{combined}"]
        over: {combined: [total, baryon]}
      - columns: ["BoverT_{combined}", "kappa_rot_{combined}"]
        over: {combined: [baryon]}
        applies_to: [galaxies]
      - columns: ["minpot_pos", "minpot_vel"]
        applies_to: [halos]
      - columns: ["radius_{quantile}_{ptype}"]
        over:
          ptype: [gas, star, dm, bh, total, baryon]
          quantile: from_config:radial_quantiles
      - columns: ["r{factor}c", "m{factor}c"]
        over: {factor: from_config:virial_factors}
        applies_to: [halos]
      - columns: ["r200", "virial_temperature", "circular_velocity", "spin_param", "vmax", "rmax"]
        applies_to: [halos]

  properties_ptype_specific:
    label: particle_specific
    applies_to: [halos, galaxies]
    requires: [properties_core]
    needs_particle_columns: [mass, temperature, metallicity, sfr, age, bhmass, bhmdot, rho]
    outputs:
      - columns: ["mass_HI", "mass_H2", "sfr", "metallicity_mass_weighted", "metallicity_sfr_weighted", "temp_mass_weighted", "mass_cold", "mass_hot"]
      - columns: ["metallicity_mass_weighted_cgm", "metallicity_temp_weighted_cgm", "temp_mass_weighted_cgm", "temp_metal_weighted_cgm", "mass_cgm"]
        applies_to: [halos]
      - columns: ["metallicity_stellar", "age_mass_weighted", "age_metal_weighted"]
      - columns: ["smbh_mass", "smbh_mdot", "smbh_fedd"]

  properties_local_environment:
    label: environment
    applies_to: [galaxies]
    requires: [properties_ptype_specific]
    needs_particle_columns: [pos, mass]
    outputs:
      - columns: ["local_mass_density_{radius}kpc", "local_number_density_{radius}kpc"]
        over: {radius: from_config:density_radii}
      - columns: ["mass_{ptype}_{aperture}kpc"]
        over:
          ptype: [gas, star, dm, bh, HI, H2, total]
          aperture: from_config:aperture_size

# output column conventions
# stamped onto HDF5 arrays on the output catalogue
# enforces dtypes, units, and provides descriptors

output_columns:

  n_{ptype}:
    over:        {ptype: [gas, star, dm, bh]}
    dtype:       int64
    unit:        ""
    a_exp:       0
    description: "Number of (ptype) particles."

  mass_{ptype}:
    over:        {ptype: [gas, star, dm, bh, total, baryon]}
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Total (ptype) mass."

  mass_HI:
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Neutral atomic hydrogen mass."

  mass_H2:
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Molecular hydrogen mass."

  minpot_pos:
    dtype:       float64
    unit:        "kpc"
    a_exp:       1
    description: "Position vector of the particle at the (halo) minimum potential."

  minpot_vel:
    dtype:       float64
    unit:        "km/s"
    a_exp:       0
    description: "Velocity vector of the particle at the (halo) minimum potential."

  "com_pos_{ptype}":
    over:        {ptype: [total, baryon]}
    dtype:       float64
    unit:        "kpc"
    a_exp:       1
    description: "Position vector of the centre-of-mass."

  "com_vel_{ptype}":
    over:        {ptype: [total, baryon]}
    dtype:       float64
    unit:        "km/s"
    a_exp:       0
    description: "Velocity vector of the centre-of-mass."

  "L_{ptype}":
    over:        {ptype: [gas, star, dm, bh, total, baryon]}
    dtype:       float64
    unit:        "Msun*kpc*km/s"
    a_exp:       1
    description: "Angular momentum vector."

  velocity_dispersion_{ptype}:
    over:        {ptype: [gas, star, dm, bh, total, baryon]}
    dtype:       float64
    unit:        "km/s"
    a_exp:       0
    description: "Mass-weighted (ptype) 3D velocity dispersion."

  L_azimuth_{ptype}:
    over:        {ptype: [gas, star, dm, bh, total, baryon]}
    dtype:       float64
    unit:        "rad"
    a_exp:       0
    description: "Azimuthal angular momentum angle (phi)."

  L_elevation_{ptype}:
    over:        {ptype: [gas, star, dm, bh, total, baryon]}
    dtype:       float64
    unit:        "rad"
    a_exp:       0
    description: "Elevation angular momentum angle (theta)."

  inertia_tensor_{ptype}:
    over:         {ptype: [gas, star, dm, bh, total, baryon]}
    dtype:        float64
    unit:         "Msun*kpc**2"
    a_exp:        2
    description:  "Moment of inertia tensor."

  BoverT_{ptype}:
    over:        {ptype: [gas, star, dm, bh, baryon]}
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Bulge-to-total (ptype) mass ratio; the bulge mass is kinematically defined as twice the mass which is rotating contrary to the bulk motion."

  kappa_rot_{ptype}:
    over:        {ptype: [gas, star, dm, bh, baryon]}
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Ratio of (ptype) rotational KE to total KE (rotational support parameter, Sales et al. (2012))."

  "radius_{quantile}_{ptype}":
    over:        {ptype: [gas, star, dm, bh, total, baryon], quantile: from_config:radial_quantiles}
    dtype:       float64
    unit:        "kpc"
    a_exp:       1
    description: "Radius which encloses the fraction (in the quantile) of the (ptype) mass."

  # only halos
  vmax:
    dtype:       float64
    unit:        "km/s"
    a_exp:       0
    description: "Maximum circular velocity."

  rmax:
    dtype:       float64
    unit:        "kpc"
    a_exp:       1
    description: "Radius at which vmax occurs."

  r200:
    dtype:       float64
    unit:        "kpc"
    a_exp:       1
    description: "Virial radius (200x mean matter density)."

  "r{factor}c":
    over:        {factor: from_config:virial_factors}
    dtype:       float64
    unit:        "kpc"
    a_exp:       1
    description: "Radius enclosing {factor}x critical density."

  "m{factor}c":
    over: {factor: from_config:virial_factors}
    dtype: float64
    unit: "Msun"
    a_exp:       0
    description: "Mass enclosed within r{factor}c."

  circular_velocity:
    dtype:       float64
    unit:        "km/s"
    a_exp:       0
    description: "Circular velocity at r200."

  spin_param:
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Spin parameter (Bullock) (uses r200)."

  virial_temperature:
    dtype:       float64
    unit:        "K"
    a_exp:       0
    description: "Virial temperature (uses r200)."
  # end only halos

  # only gas
  sfr:
    dtype:       float64
    unit:        "Msun/yr"
    a_exp:       0
    description: "Total star formation rate."

  metallicity_mass_weighted:
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Mass-weighted gas metallicity."

  metallicity_sfr_weighted:
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "SFR-weighted gas metallicity."

  metallicity_mass_weighted_cgm: # only halos
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Mass-weighted CGM gas metallicity."

  metallicity_temp_weighted_cgm: # only halos
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Temperature-weighted CGM gas metallicity."

  temp_mass_weighted:
    dtype:       float64
    unit:        "K"
    a_exp:       0
    description: "Mass-weighted gas temperature."

  temp_mass_weighted_cgm: # only halos
    dtype:       float64
    unit:        "K"
    a_exp:       0
    description: "Mass-weighted CGM gas temperature."

  temp_metal_weighted_cgm: # only halos
    dtype:       float64
    unit:        "K"
    a_exp:       0
    description: "Metallicity-weighted CGM gas temperature."

  mass_cgm:  # only haloes
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "CGM gas mass."

  mass_cold:
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Cold gas mass (as defined in user config Tlim)."

  mass_hot:
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Hot gas mass (as defined in user config Tlim)."
  # end only gas

  # only stars
  metallicity_stellar:
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Mass-weighted stellar metallicity."

  age_mass_weighted:
    dtype:       float64
    unit:        "Gyr"
    a_exp:       0
    description: "Mass-weighted stellar age."

  age_metal_weighted:
    dtype:       float64
    unit:        "Gyr"
    a_exp:       0
    description: "Metallicity-weighted stellar age."
  # end only stars

  # only black holes
  smbh_mdot:
    dtype:       float64
    unit:        "Msun/yr"
    a_exp:       0
    description: "Accretion rate of the most massive BH."

  smbh_fedd:
    dtype:       float64
    unit:        ""
    a_exp:       0
    description: "Eddington fraction of the most massive BH."

  smbh_mass:
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Mass of the most massive black hole."

  # end only black holes

  "mass_{ptype}_{aperture}kpc":
    over:        {ptype: [gas, star, dm, bh], aperture: from_config:aperture_size}
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Mass within the specified kpc aperture."

  mass_HI_{aperture}kpc:
    over: {aperture: from_config:aperture_size}
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "HI mass within the specified kpc aperture."

  mass_H2_{aperture}kpc:
    over: {aperture: from_config:aperture_size}
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "H2 mass within the specified kpc aperture."

  mass_total_{aperture}kpc:
    over: {aperture: from_config:aperture_size}
    dtype:       float64
    unit:        "Msun"
    a_exp:       0
    description: "Total mass within the specified kpc aperture."

  "local_mass_density_{radius}kpc":
    over:        {radius: from_config:density_radii}
    dtype:       float64
    unit:        "Msun/kpc**3"
    a_exp:       -3
    description: "Local mass density (smoothing over specified kpc radius)."

  "local_number_density_{radius}kpc":
    over:        {radius: from_config:density_radii}
    dtype:       float64
    unit:        "1/kpc**3"
    a_exp:       -3
    description: "Local number density (smoothing over specified kpc radius)."

membership_columns:

  halos:
    parent:
      dtype: int64
      description: "Row index of immediate parent in halo_data (-1 for field halos)."
      unit: ""
      a_exp:       0
    depth:
      dtype: int64
      description: "Level of nestage (0 for field halos)."
      unit: ""
      a_exp:       0
    central_galaxy_index:
      dtype: int64
      description: "Most massive galaxy in halo (inclusive of substructure, -1 if no galaxy)."
      unit: ""
      a_exp:       0

  galaxies:
    field_halo_index: 
      dtype: int64
      description: "Catalogue index of galaxy's field halo."
      unit: ""
      a_exp:       0
    parent_halo_index: 
      dtype: int64
      description: "Catalogue index of immediate parent (sub)halo (equal to field_halo_index if no subhalo info); parent decided by plurality."
      unit: ""
      a_exp:       0
    parent_membership_fraction:
      dtype: float32
      description: "Fraction of galaxy's subhalo-assigned particles belonging to the halo at parent_halo_index."
      unit: ""
      a_exp:       0

header_fields:

  boxsize:
    unit: "kpc"
    a_exp: 1
    description: "Length of the box; this is always cubic, so V = boxsize**3"
  h:
    unit: ""
    a_exp: 0
    description: "Reduced Hubble constant."
  a:
    unit: ""
    a_exp: 0
    description: "Scale factor at this redshift."
  redshift:
    unit: ""
    a_exp: 0
    description: "Redshift of the snapshot."
  omega_matter:
    unit: ""
    a_exp: 0
    description: "Dimensionless mean matter density at z = 0."
  omega_lambda:
    unit: ""
    a_exp: 0
    description: "Dimensionless mean dark energy density at z = 0."
  w_0:
    unit: ""
    a_exp: 0
    description: "Value of the dark energy EoS parameter at z = 0."
  w_a:
    unit: ""
    a_exp: 0 
    description: "Temporal evolution of the dark energy EoS."
  mis:
    unit: "kpc"
    a_exp: 1
    description: "Mean baryonic interparticle separation."
  time_gyr:
    unit: "Gyr"
    a_exp: 0
    description: "Age of the universe at this redshift."
  Hz:
    unit: "km/s/Mpc"
    a_exp: 0
    description: "Hubble constant at this redshift."
  rhocrit:
    unit: "Msun/kpc**3"
    a_exp: 0
    description: "Critical density of the Universe at this redshift."
  r200_factor:
    unit: "kpc/Msun**1/3"
    a_exp: 0
    description: "r200 prefactor."
  